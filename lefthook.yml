# Lefthook config for this chezmoi source repo's own git hooks.
# Binary is declared in Brewfile; activate once per clone with `lefthook install`.
# Kept out of chezmoi deployment via .chezmoiignore (would otherwise map to ~/lefthook.yml).

pre-commit:
  parallel: true
  commands:
    # Keep the Claude permission allowlist sorted so appended entries don't dirty the diff
    sort-claude-settings:
      run: |
        if [ -f .claude/settings.local.json ]; then
          jq --indent 2 '.permissions.allow |= ((. // []) | sort)' .claude/settings.local.json > .claude/.temp.$$.json && \
          mv .claude/.temp.$$.json .claude/settings.local.json
        fi
      stage_fixed: true

    # Format shell scripts to the .editorconfig 2-space style; .sh.tmpl is excluded by the *.sh glob.
    # -ci keeps case bodies indented (matches the existing scripts; shfmt flattens them by default).
    shfmt:
      glob: "*.sh"
      run: shfmt -i 2 -ci -w {staged_files}
      stage_fixed: true

    # Static analysis for plain scripts; any finding (including info level) fails the commit
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # Most scripts are templates, which shellcheck cannot parse raw, so lint them as rendered
    # for the committing host. Templates for another OS render to whitespace, which chezmoi
    # itself skips, so they are skipped here too rather than tripping SC2148.
    shellcheck-templates:
      glob: "*.sh.tmpl"
      run: |
        for file in {staged_files}; do
          rendered=$(chezmoi execute-template < "$file") || { echo "Template render failed: $file"; exit 1; }
          [ -z "$(printf '%s' "$rendered" | tr -d '[:space:]')" ] && continue
          printf '%s\n' "$rendered" | shellcheck - || { echo "shellcheck failed: $file"; exit 1; }
        done

    # Lint Markdown; .claude/plans/ is gitignored so it never reaches staging
    markdownlint:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}

    # Validate that strict JSON still parses; JSONC (Zed/VSCode) is excluded
    check-json:
      glob: "*.json"
      exclude:
        - "**/zed/**"
        - ".vscode/**"
      run: |
        for file in {staged_files}; do
          jq empty "$file" || { echo "Invalid JSON: $file"; exit 1; }
        done
